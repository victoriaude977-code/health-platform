# Production nginx config for the Vue SPA + API reverse proxy.
# The frontend container serves the built app AND forwards API calls to the
# backend container, so browsers only ever talk to one origin (no CORS in
# production).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Avatar uploads are capped at 2 MB by the backend; allow a little slack.
    client_max_body_size 3m;

    # The JS bundle is ~1.3 MB; gzip cuts it to ~330 KB, which matters a lot
    # on slow cross-border links (Aliyun SG <-> China).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    # Fingerprinted build assets never change -> cache aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API -> Flask/waitress (path is passed through unchanged).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded avatar images -> Flask static serving.
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # SPA routing: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
