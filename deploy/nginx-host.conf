# Host-level nginx config for HTTPS (Step 8 of docs/deploy.md).
# certbot --nginx rewrites this file to add the TLS certificate.
#
# Use only AFTER setting FRONTEND_PORT=8080 in .env (docker-compose moves the
# frontend container off port 80 so this nginx can take it).
server {
    listen 80;
    server_name health.example.com;   # <- replace with YOUR domain

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
